[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cathode-cvae"
version = "0.1.0"
description = "Reproducible vacancy and displacement CVAE experiments for ECE 285"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.6,<3",
  "matplotlib>=3.8,<4",
  "pandas>=2.2,<3",
  "scipy>=1.12,<2",
  "ase>=3.26,<4",
  "spglib>=2.5,<3",
  "huggingface-hub>=0.27.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2"]

[project.scripts]
cathode-cvae = "cathode_cvae.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
