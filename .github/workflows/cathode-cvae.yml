name: Cathode CVAE package
on:
  push:
    paths: ['final_project/**', '.github/workflows/cathode-cvae.yml']
  pull_request:
    paths: ['final_project/**', '.github/workflows/cathode-cvae.yml']
jobs:
  portable-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: final_project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: final_project/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements/learning.txt '.[dev]'
      - run: python -m pip check
      - run: cathode-cvae data verify --snapshot artifacts/current
      - run: python -m pytest -q
